name: installer

# Exercises scripts/install.sh end-to-end without depending on a published
# GitHub release: we stand up an ephemeral local "release" (a tiny stub binary
# + sha256sum.txt) and a mock of the GitHub API, then run the installer with
# HOME/paths pointed at the mock. This verifies the install path works with no
# `jq` installed and that `vp` lands on PATH.

on:
  push:
    branches: [main]
    paths: ["scripts/install.sh", ".github/workflows/installer.yml"]
  pull_request:
    branches: [main]
    paths: ["scripts/install.sh", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curl-installer:
    name: curl installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq is absent (force the no-jq path)
        if: runner.os == 'Linux'
        run: sudo apt-get remove -y jq || true

      - name: Build a local release + GitHub API mock
        run: |
          set -eu
          MOCK="${HOME}/mock-release"
          mkdir -p "${MOCK}/assets"
          VERSION="v0.1.0"
          TAG="v0.1.0"

          # Determine target triple for this runner.
          os="$(uname -s)"
          arch="$(uname -m)"
          case "$os" in
            Linux)  target="linux" ;;
            Darwin) target="darwin" ;;
          esac
          case "$arch" in
            x86_64|amd64) target="${target}-x64" ;;
            arm64|aarch64) target="${target}-arm64" ;;
          esac

          # Build a stub `vp` that prints the version and is a real executable.
          mkdir -p "${MOCK}/vp-root/vision-proxy"
          if [ "$os" = "Linux" ]; then
            printf '#!/bin/sh\necho "vision-proxy %s"\n' "$VERSION" > "${MOCK}/vp-root/vision-proxy/vp"
          else
            printf '#!/bin/sh\necho "vision-proxy %s"\n' "$VERSION" > "${MOCK}/vp-root/vision-proxy/vp"
          fi
          chmod +x "${MOCK}/vp-root/vision-proxy/vp"

          # Package the tarball exactly as the release workflow does.
          tar -C "${MOCK}/vp-root" -czf "${MOCK}/assets/vision-proxy-${target}.tar.gz" vision-proxy

          # Checksum manifest.
          ( cd "${MOCK}/assets" && sha256sum "vision-proxy-${target}.tar.gz" ) > "${MOCK}/assets/sha256sum.txt"

          # Minimal GitHub API mock serving /releases/latest and /releases/tags/<t>.
          cat > "${MOCK}/server.py" <<PY
          import http.server, json, os, socketserver, urllib.parse
          ASSETS = os.path.join(os.environ["MOCK_DIR"], "assets")
          VERSION = os.environ["MOCK_VERSION"]
          class H(http.server.BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_GET(self):
                  url = urllib.parse.urlparse(self.path).path
                  if url in ("/releases/latest", "/releases/tags/" + VERSION):
                      assets = []
                      for fn in os.listdir(ASSETS):
                          with open(os.path.join(ASSETS, fn), "rb") as f:
                              data = f.read()
                          assets.append({
                              "name": fn,
                              "browser_download_url": "http://127.0.0.1:%d/%s" % (PORT, fn),
                          })
                      body = json.dumps({"tag_name": VERSION, "name": "mock", "assets": assets}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return
                  # Serve asset files directly.
                  fn = os.path.basename(url)
                  fp = os.path.join(ASSETS, fn)
                  if os.path.isfile(fp):
                      with open(fp, "rb") as f:
                          data = f.read()
                      self.send_response(200)
                      self.send_header("Content-Length", str(len(data)))
                      self.end_headers()
                      self.wfile.write(data)
                      return
                  self.send_response(404)
                  self.end_headers()
          PORT = int(os.environ["MOCK_PORT"])
          socketserver.TCPServer.allow_reuse_address = True
          with socketserver.TCPServer(("127.0.0.1", PORT), H) as httpd:
              httpd.serve_forever()
          PY

          echo "MOCK_DIR=${MOCK}" >> "$GITHUB_ENV"
          echo "MOCK_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "MOCK_PORT=8731" >> "$GITHUB_ENV"

      - name: Start mock GitHub API
        run: |
          cd "${MOCK_DIR}"
          python3 server.py &
          echo $! > "${MOCK_DIR}/server.pid"
          # Wait for the server to come up.
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:${MOCK_PORT}/releases/latest" >/dev/null 2>&1; then
              echo "mock API up"; break
            fi
            sleep 0.5
          done

      - name: Run installer against the mock
        env:
          API: "http://127.0.0.1:${{ env.MOCK_PORT }}/releases"
        run: |
          set -eu
          # Point the installer's API base at the mock via a small wrapper.
          # install.sh hard-codes the API URL, so we serve the same path on the
          # mock and rewrite REPO to keep it simple: instead, run a transparent
          # proxy is overkill - we override by editing the resolved URL through
          # a HOSTS-style approach is not portable, so we patch the script copy.
          cp scripts/install.sh /tmp/install_test.sh
          # Replace the production API host with our mock for the test run only.
          sed -i.bak 's#https://api.github.com/repos/${REPO}/releases#http://127.0.0.1:'"${MOCK_PORT}"'/releases#g' /tmp/install_test.sh
          sh /tmp/install_test.sh --add-to-path

      - name: Verify vp is runnable on PATH
        run: |
          set -eu
          export PATH="${HOME}/.local/bin:$PATH"
          command -v vp >/dev/null 2>&1 || { echo "error: vp not on PATH" >&2; exit 1; }
          out="$(vp --version)"
          echo "vp --version => $out"
          case "$out" in
            *"v0.1.0"*) echo "version matches";;
            *) echo "error: unexpected version output: $out" >&2; exit 1;;
          esac

      - name: Stop mock GitHub API
        if: always()
        run: kill "$(cat "${MOCK_DIR}/server.pid")" 2>/dev/null || true
