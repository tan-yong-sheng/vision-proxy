name: OSV Scanner Scheduled Scan

on:
  schedule:
    # Run every Monday at noon UTC.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  osv-scheduled-scan:
    name: OSV Scanner Scheduled Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OSV-Scanner
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            -r ./
            --lockfile=pnpm-lock.yaml
            --format=json
            --output=results.json

      - name: Generate SARIF report
        uses: google/osv-scanner-action/osv-reporter-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=false

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: osv-scanner

      - name: Upload SARIF artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: OSV Scanner SARIF file
          path: results.sarif
          retention-days: 30

      - name: Print Security tab URL
        if: ${{ !cancelled() }}
        run: |
          echo "View the OSV-Scanner results in the 'Security' tab:"
          echo "${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=is%3Aopen+branch%3A${GITHUB_REF_NAME}+tool%3Aosv-scanner"
