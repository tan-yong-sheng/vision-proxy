name: release

# Build per-OS/arch tarballs of the compiled CLI (Track A: JS dist + Node 22)
# and publish them to GitHub Releases alongside a sha256 manifest.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-14
          - target: windows-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dist
        run: pnpm run build

      - name: Prune dev dependencies
        # The tarball ships only production deps; typescript/@types are build-time only.
        run: pnpm prune --prod

      - name: Stage release tree
        shell: bash
        run: |
          mkdir -p stage/vision-proxy
          cp -R dist node_modules package.json stage/vision-proxy/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp scripts/vp.cmd stage/vision-proxy/vp.cmd
          else
            cp scripts/vp stage/vision-proxy/vp
            chmod +x stage/vision-proxy/vp
          fi

      - name: Package
        shell: bash
        run: tar -C stage -czf "vision-proxy-${{ matrix.target }}.tar.gz" vision-proxy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vision-proxy-${{ matrix.target }}
          path: vision-proxy-${{ matrix.target }}.*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum vision-proxy-* > sha256sum.txt
          cat sha256sum.txt

      - name: Update Formula checksums
        # Fill Formula/vision-proxy.rb with the real per-arch sha256 values from
        # the just-generated sha256sum.txt so `brew install` works after release.
        run: |
          set -eu
          sha_file="artifacts/sha256sum.txt"
          formula="Formula/vision-proxy.rb"
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            asset="vision-proxy-${target}.tar.gz"
            sum="$(awk -v a="$asset" '$2 == a {print $1}' "$sha_file")"
            if [ -z "$sum" ]; then
              echo "::warning::missing checksum for $asset" >&2
              continue
            fi
            # Replace the sha256 line that immediately follows the matching url line.
            awk -v asset="$asset" -v sum="$sum" '
              /^ *url / && $0 ~ asset { pending = 1; print; next }
              pending && /sha256 "/ {
                sub(/"[0-9a-f]+"/, "\"" sum "\"")
                pending = 0
              }
              { print }
            ' "$formula" > "${formula}.tmp" && mv "${formula}.tmp" "$formula"
          done
          echo "Updated Formula checksums:"
          grep -A1 "vision-proxy-" "$formula" | grep sha256

      - name: Commit updated Formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Formula/vision-proxy.rb; then
            echo "Formula unchanged; nothing to commit."
            exit 0
          fi
          git add Formula/vision-proxy.rb
          git commit -m "chore(formula): backfill sha256 for v${GITHUB_REF_NAME#v}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/vision-proxy-*.tar.gz
            artifacts/sha256sum.txt
          generate_release_notes: true
